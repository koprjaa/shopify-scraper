[package]
name = "shopify-scraper"
version = "1.0.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva"]
license = "MIT"
description = "Exports the product feed of any Shopify store."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "deflate", "socks"] }
encoding_rs = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
regex = "1"

[dev-dependencies]
tempfile = "3"
